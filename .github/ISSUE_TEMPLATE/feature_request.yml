name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: Does this change what the bot writes to the thermostat, or when? (see CONTRIBUTING.md ground rules)
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
