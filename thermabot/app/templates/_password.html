<section class="card"><h3>Change my password</h3>
<form data-api="POST api/me/password" data-done="Password changed; other devices signed out" data-reload
      data-testid="password-form">
  <input type="text" name="" autocomplete="username" value="{{ p.username }}" hidden>
  <div class="grid">
    <label>Current password <input name="current" type="password" required autocomplete="current-password"></label>
    <label>New password <input name="new" type="password" minlength="8" required autocomplete="new-password"></label>
    <label>Confirm new password <input name="confirm" type="password" minlength="8" required autocomplete="new-password"></label>
  </div>
  <p class="errors" data-testid="errors"></p>
  <button type="submit">Change password</button>
</form></section>
