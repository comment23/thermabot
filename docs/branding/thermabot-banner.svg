<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title description">
  <title id="title">Thermabot: thoughtful comfort, safe by design</title>
  <desc id="description">A home and thermometer mark alongside a stylized comfort dial.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b302d"/>
      <stop offset="1" stop-color="#061d1d"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#155b4f"/>
      <stop offset="1" stop-color="#082f2b"/>
    </linearGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#80e2d0"/>
      <stop offset=".52" stop-color="#d5efcb"/>
      <stop offset="1" stop-color="#ffb88f"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#3c9c82" stop-opacity=".3"/>
      <stop offset="1" stop-color="#3c9c82" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="480" rx="28" fill="url(#canvas)"/>
  <circle cx="1070" cy="240" r="360" fill="url(#glow)"/>
  <path d="M-20 435C270 354 493 490 742 408s442-76 724-16" fill="none" stroke="#b3f3d9" stroke-opacity=".07" stroke-width="2"/>
  <path d="M-20 454c290-81 513 55 762-27s442-76 724-16" fill="none" stroke="#b3f3d9" stroke-opacity=".04" stroke-width="2"/>

  <g transform="translate(78 69) scale(.7)">
    <rect x="1" y="1" width="126" height="126" rx="33" fill="url(#tile)"/>
    <rect x="1.5" y="1.5" width="125" height="125" rx="32.5" fill="none" stroke="#a9ebd3" stroke-opacity=".25"/>
    <path d="M25 57.5 64 28l39 29.5" fill="none" stroke="#effff9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M37 53v30c0 7 5 12 12 12h30c7 0 12-5 12-12V53" fill="none" stroke="#91dac4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M64 49v27" fill="none" stroke="#effff9" stroke-width="7" stroke-linecap="round"/>
    <circle cx="64" cy="82" r="8" fill="#ffb88f"/>
    <path d="M51 67a18 18 0 0 0-3 15" fill="none" stroke="#77dccc" stroke-width="3" stroke-linecap="round"/>
    <path d="M77 67a18 18 0 0 1 3 15" fill="none" stroke="#ffb88f" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="188" y="126" fill="#eafff5" font-size="39" font-weight="750" letter-spacing="-.8">thermabot</text>
    <text x="80" y="234" fill="#f3fff9" font-size="66" font-weight="700" letter-spacing="-2">A more thoughtful</text>
    <text x="80" y="310" fill="#a5e8cf" font-size="66" font-weight="700" letter-spacing="-2">kind of comfort.</text>
    <text x="82" y="365" fill="#c6dfd5" font-size="23">Home Assistant comfort, with safety first.</text>
    <text x="82" y="416" fill="#94c2b3" font-size="15" font-weight="700" letter-spacing="2.1">OBSERVE  /  UNDERSTAND  /  CONTROL</text>
  </g>

  <g transform="translate(1095 240)">
    <circle r="175" fill="#0b332e" stroke="#b3f3d9" stroke-opacity=".13" stroke-width="2"/>
    <circle r="148" fill="#0c2826" stroke="#b3f3d9" stroke-opacity=".1" stroke-width="2"/>
    <circle r="124" fill="none" stroke="#31594e" stroke-width="15"/>
    <path d="M-103 69A124 124 0 1 1 103 69" fill="none" stroke="url(#dial)" stroke-width="15" stroke-linecap="round"/>
    <circle r="91" fill="#102f2b" stroke="#c4f1dc" stroke-opacity=".12"/>
    <path d="M-39-5 0-36 39-5" fill="none" stroke="#ecfff6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-27-12v32c0 7 5 12 12 12h30c7 0 12-5 12-12v-32" fill="none" stroke="#92d7bf" stroke-width="5" stroke-linecap="round"/>
    <path d="M0-15v29" fill="none" stroke="#ecfff6" stroke-width="6" stroke-linecap="round"/>
    <circle cy="20" r="7" fill="#ffb88f"/>
    <circle cx="-108" cy="65" r="5" fill="#80e2d0"/>
    <circle cx="108" cy="65" r="5" fill="#ffb88f"/>
